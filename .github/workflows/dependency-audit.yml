name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocking: what ships to users.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Visible but non-blocking: build/dev tooling (tailwindcss 3 and eslint-config-next
      # pull in braces/micromatch advisories that have no non-breaking fix yet).
      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
