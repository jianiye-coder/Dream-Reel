name: Quality sweep

# Once a day: score main against docs/golden-principles.md, let Claude make the single most valuable
# small fix (or draft an issue when the fix needs a protected path), and publish it as one PR labelled
# quality-sweep. quality-automerge.yml decides whether that PR may merge itself.
#
# Jobs, so that no repository code (main's or the agent's) ever runs next to a secret:
# - score (no secrets): skips cleanly without CLAUDE_CODE_OAUTH_TOKEN or while a sweep PR is open;
#   otherwise runs main's `npm run quality` and hands score-main.json on as an artifact.
# - sweep: only checkout, that artifact and the action. Claude (CLAUDE_CODE_OAUTH_TOKEN; read-only
#   job token) may only read the checkout and edit files under src/, docs/, tests/unit/ and its
#   drafts in .quality-sweep/; it has no shell. Afterwards git packages the diff and the drafts,
#   size-limited and scanned for secret-like strings, and uploads them.
# - verify: a fresh checkout with the diff applied runs lint, tsc, knip, the unit tests and the score,
#   with no secrets and a read-only token. This is the only place the agent's code runs.
# - publish (write token, runs no repository code): validates the diff against an allowlist, commits
#   it as github-actions[bot], pushes quality-sweep/<date>-<slug>, opens the PR and dispatches CI and
#   the auto-merge gate with this run's id (PRs opened with GITHUB_TOKEN don't start pull_request
#   workflows; workflow_dispatch ones do). Or it files the drafted issue.
# - main-guard: main may only have moved through merged PRs during the run.
# Branch protection on main is the backstop: see README.

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC: 8:00 in Chicago during daylight time, 7:00 in winter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-sweep
  cancel-in-progress: false

env:
  # keep these identical in quality-automerge.yml (and the list in .github/quality-sweep-prompt.md)
  ALLOWED: '^(src/|docs/|tests/unit/)'
  PROTECTED: '^(src/app/api/|src/lib/billing\.ts$|src/lib/stripe\.ts$|src/lib/dreams\.ts$|src/lib/safeServerLog\.ts$|src/lib/email\.ts$|src/lib/session\.ts$|src/lib/authRateLimit\.ts$|src/lib/db\.ts$|src/lib/dreamTextEncryption\.ts$|src/auth|src/middleware|src/proxy|src/instrumentation|src/types/next-auth\.d\.ts$|tests/unit/i18n-keys\.test\.ts$|docs/golden-principles\.md$)|(^|/)route\.[jt]sx?$|(^|/)actions?\.[jt]sx?$|(^|/)\.|(^|/)(CLAUDE|AGENTS)\.md$|(^|/)package(-lock)?\.json$|migration'
  # ASCII path characters Next.js routes use (letters, digits, . _ / ( ) + @ [ ] -)
  SAFE_PATH: '^[]A-Za-z0-9._/()+@[-]+$'
  SECRET_LIKE: 'sk-ant-|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|xox[abprs]-|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|CLAUDE_CODE_OAUTH_TOKEN=|x-access-token:'
  MAX_CHANGED_LINES: 150
  MAX_CHANGED_FILES: 10

jobs:
  # main's own code, with no secrets: the gate, then the score the agent starts from
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      # skip cleanly (a notice, not a failure) until the owner has added the token, and while a
      # sweep PR is open (one at a time; saves the Claude usage)
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::the sweep only runs on main"; exit 1; fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the quality sweep (see README, Code quality)."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --label quality-sweep --state open --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "::notice::A quality-sweep PR is already open; skipping today's sweep."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # github.sha: main as it was when this run was triggered (the gate checks the PR's parent is it)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.skip == 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Score main
        if: steps.gate.outputs.skip == 'false'
        run: |
          npm ci
          npm run quality > /dev/null
          mkdir -p "$RUNNER_TEMP/score-main"
          cp quality/score.json "$RUNNER_TEMP/score-main/score-main.json"
          cat quality/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.gate.outputs.skip == 'false'
        with:
          name: quality-score-main
          path: ${{ runner.temp }}/score-main/
          retention-days: 3

  # Only checkout, the score file and the action: no setup-node, no npm, no repository code runs in
  # this job, so nothing can be waiting for the agent's secrets.
  sweep:
    needs: score
    if: needs.score.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      main_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-score-main
          path: quality

      - name: Build the prompt
        id: prompt
        run: |
          {
            echo "text<<QUALITY_SWEEP_PROMPT"
            echo "Repository: $GITHUB_REPOSITORY. Today (UTC): $(date -u +%F)."
            echo
            cat .github/quality-sweep-prompt.md
            echo "QUALITY_SWEEP_PROMPT"
          } >> "$GITHUB_OUTPUT"

      # Read and edit only, inside the checkout; no shell at all.
      - name: Sweep
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # the job's read-only token, so the agent session never holds a write token
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --max-turns 80
            --allowedTools "Read(./**),Glob,Grep,Edit(src/**),Edit(docs/**),Edit(tests/unit/**),Edit(.quality-sweep/**)"
            --disallowedTools "Bash,Read(.git/**),Read(//proc/**),Read(//sys/**),Read(~/**),Read(//tmp/**),Read(//home/**),WebFetch,WebSearch,Task,NotebookEdit"

      # No code runs from here on in this job. Package the diff and the drafts, size-limited and
      # scanned for anything that looks like a secret (artifacts of a public repo are public).
      - name: Package the result
        id: package
        run: |
          set -euo pipefail
          mkdir -p sweep-out
          git add -A -- . ':!.quality-sweep' ':!quality' ':!sweep-out'
          if git diff --cached --quiet "$GITHUB_SHA"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --binary "$GITHUB_SHA" > sweep-out/change.patch
          fi
          cp quality/score-main.json sweep-out/score-main.json
          for f in slug pr.md issue.md; do
            if [ -f ".quality-sweep/$f" ]; then head -c 8192 ".quality-sweep/$f" > "sweep-out/$f"; fi
          done
          if [ -f sweep-out/change.patch ] && [ "$(wc -c < sweep-out/change.patch)" -gt 65536 ]; then
            echo "::error::the change is larger than 64 KB"; exit 1
          fi
          if grep -R -l -E "$SECRET_LIKE" sweep-out; then
            echo "::error::the sweep's output contains something that looks like a secret; nothing is uploaded"
            rm -rf sweep-out
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-sweep
          path: sweep-out/
          retention-days: 3

  verify:
    needs: sweep
    if: needs.sweep.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.sweep.outputs.main_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-sweep
          path: ${{ runner.temp }}/sweep-out

      # no npm cache here: the agent's code runs in this job and must not be able to poison it
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # the agent's code runs here only: no secrets, no write token
      - name: Lint, typecheck, knip, unit tests, score
        env:
          SWEEP_OUT: ${{ runner.temp }}/sweep-out
        run: |
          git apply --index --binary "$SWEEP_OUT/change.patch"
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run knip
          npm run test:unit
          npm run quality > /dev/null
          mkdir -p "$RUNNER_TEMP/verified"
          jq '{overall}' quality/score.json > "$RUNNER_TEMP/verified/score-after.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-sweep-verified
          path: ${{ runner.temp }}/verified/
          retention-days: 3

  publish:
    needs: [sweep, verify]
    if: >-
      always() && needs.sweep.result == 'success' &&
      (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.sweep.outputs.changed != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MAIN_SHA: ${{ needs.sweep.outputs.main_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.sweep.outputs.main_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-sweep
          path: ${{ runner.temp }}/sweep-out

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.sweep.outputs.changed == 'true'
        with:
          name: quality-sweep-verified
          path: ${{ runner.temp }}/verified

      # validates and publishes; runs only git, gh and jq, never the repository's code
      - name: Validate and publish
        env:
          OUT: ${{ runner.temp }}/sweep-out
          VERIFIED: ${{ runner.temp }}/verified
          LC_ALL: C
        run: |
          set -euo pipefail
          if grep -R -l -E "$SECRET_LIKE" "$OUT"; then echo "::error::sweep output looks like it contains a secret"; exit 1; fi
          title_of() { head -n1 "$1" | sed 's/^#* *//' | tr -cd '[:print:]' | cut -c1-120; }
          gh label create quality-sweep --repo "$REPO" --color 5319e7 --description "Daily golden-principles sweep" --force

          if [ ! -s "$OUT/change.patch" ]; then
            if [ -s "$OUT/issue.md" ]; then
              title=$(title_of "$OUT/issue.md")
              [ -n "$title" ] || { echo "::error::issue.md has no title line"; exit 1; }
              if gh issue list --repo "$REPO" --label quality-sweep --state open --json title --jq '.[].title' | grep -qxF -- "$title"; then
                echo "An open issue already covers: $title" >> "$GITHUB_STEP_SUMMARY"
              else
                { tail -n +2 "$OUT/issue.md"; printf '\n\n_Drafted by the daily quality sweep, run %s._\n' "$GITHUB_RUN_ID"; } > "$RUNNER_TEMP/issue-body.md"
                gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/issue-body.md" --label quality-sweep
              fi
            else
              echo "Nothing to publish today." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          slug=$(tr -d '[:space:]' < "$OUT/slug" 2>/dev/null || true)
          [[ "$slug" =~ ^[a-z0-9][a-z0-9-]{2,40}$ ]] || { echo "::error::.quality-sweep/slug is missing or not a short kebab-case slug"; exit 1; }
          [ -s "$OUT/pr.md" ] || { echo "::error::.quality-sweep/pr.md is missing"; exit 1; }
          title=$(title_of "$OUT/pr.md")
          [ -n "$title" ] || { echo "::error::pr.md has no title line"; exit 1; }
          after=$(jq -r '.overall' "$VERIFIED/score-after.json")
          before=$(jq -r '.overall' "$OUT/score-main.json")
          [[ "$after" =~ ^[0-9]+$ && "$before" =~ ^[0-9]+$ ]] || { echo "::error::unexpected score values"; exit 1; }

          git apply --index --binary "$OUT/change.patch"
          reasons=()
          # --raw -z: modes and NUL-separated paths (no quoting); renames show both paths
          files=0
          while IFS= read -r -d '' meta; do
            read -r src_mode dst_mode _ _ status <<<"${meta#:}"
            IFS= read -r -d '' path
            paths=("$path")
            if [[ "$status" == R* || "$status" == C* ]]; then IFS= read -r -d '' path2; paths+=("$path2"); fi
            files=$((files + 1))
            case "$status" in A|M|D|R[0-9]*) ;; *) reasons+=("unsupported change $status: ${paths[*]}") ;; esac
            for m in "$src_mode" "$dst_mode"; do
              [[ "$m" == 100644 || "$m" == 000000 ]] || reasons+=("file mode $m (only regular 100644 files): ${paths[*]}")
            done
            for p in "${paths[@]}"; do
              [[ "$p" =~ $SAFE_PATH ]] || { reasons+=("path with unusual characters: $p"); continue; }
              [[ "$p" =~ $ALLOWED ]] || reasons+=("outside src/, docs/, tests/unit/: $p")
              grep -qE -- "$PROTECTED" <<<"$p" && reasons+=("protected path: $p")
            done
            if [[ "${paths[0]}" == tests/* && "$status" != A ]]; then reasons+=("modifies or removes an existing test: ${paths[0]}"); fi
            last="${paths[${#paths[@]}-1]}"
            if [ "$status" != D ] && [ -f "$last" ] && grep -qE "^[[:space:]]*['\"]use server['\"]" "$last"; then reasons+=("server actions file: $last"); fi
          done < <(git diff --cached -M --raw -z HEAD)
          # only the counts are used here; binary files show "-"
          read -r lines binary < <(git diff --cached -M --numstat HEAD | awk -F'\t' '{ if ($1 == "-") b++; else s += $1 + $2 } END { print s + 0, b + 0 }')
          [ "$binary" -eq 0 ] || reasons+=("changes $binary binary file(s)")
          [ "$files" -le "$MAX_CHANGED_FILES" ] || reasons+=("changes $files files (limit $MAX_CHANGED_FILES)")
          [ "$lines" -le "$MAX_CHANGED_LINES" ] || reasons+=("changes $lines lines (limit $MAX_CHANGED_LINES)")
          [ "$files" -gt 0 ] || reasons+=("no file changes")
          if [ ${#reasons[@]} -ne 0 ]; then
            { echo "The sweep's change was not published:"; printf -- '- %s\n' "${reasons[@]}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the sweep's change breaks the publishing rules (see the summary)"
            exit 1
          fi

          branch="quality-sweep/$(date -u +%F)-$slug"
          if gh api "repos/$REPO/git/ref/heads/$branch" > /dev/null 2>&1; then echo "::error::branch $branch already exists"; exit 1; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$title" -m "Opened by the daily quality sweep, run $GITHUB_RUN_ID."
          git push "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git" "HEAD:refs/heads/$branch"
          {
            tail -n +2 "$OUT/pr.md"
            echo
            echo "**Score (computed by the workflow's verify job):** overall $before → $after"
            echo
            echo "_Opened by the daily quality sweep, run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID). Auto-merge is decided by .github/workflows/quality-automerge.yml._"
            echo "<!-- quality-sweep-run: $GITHUB_RUN_ID -->"
          } > "$RUNNER_TEMP/pr-body.md"
          url=$(gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md" --label quality-sweep)
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run ci.yml --repo "$REPO" --ref "$branch"
          gh workflow run quality-automerge.yml --repo "$REPO" --ref main -f pr="${url##*/}" -f run_id="$GITHUB_RUN_ID"

  # Backstop next to branch protection, for the window of this run (the sweep PR itself merges later,
  # through auto-merge): main must not have been force-pushed, and every commit that reached it since
  # the run started must belong to a merged PR.
  main-guard:
    needs: [score, sweep, verify, publish]
    if: always() && needs.score.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check that main only moved through merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          compare=$(gh api "repos/$REPO/compare/$START_SHA...main")
          status=$(jq -r .status <<<"$compare")
          case "$status" in
            identical|ahead) ;;
            *) echo "::error::main is $status relative to $START_SHA (force-pushed or rewritten?)"; exit 1 ;;
          esac
          bad=()
          for sha in $(jq -r '.commits[].sha' <<<"$compare"); do
            pulls=$(gh api "repos/$REPO/commits/$sha/pulls")
            merged=$(jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length' <<<"$pulls")
            [ "$merged" -gt 0 ] || bad+=("$sha")
          done
          if [ ${#bad[@]} -ne 0 ]; then
            echo "::error::main gained commits that did not come through a merged PR: ${bad[*]}"
            exit 1
          fi
